<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>กรอกข้อมูลแจ้งซ่อม</title>
  
  <!-- Tailwind CSS & FontAwesome Icons & LIFF SDK -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 flex items-center justify-center">

  <div id="requestFormCard" class="w-full max-w-md bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden fade-in">

    <!-- Header -->
    <div class="px-5 py-3 border-b border-gray-100 bg-gray-50/50 flex items-center gap-2">
      <i class="fa-solid fa-paper-plane text-amber-500 text-xs"></i>
      <span class="text-xs font-bold text-gray-700">กรอกข้อมูลแจ้งซ่อม</span>
    </div>

    <form id="requestForm" onsubmit="handleRequestSubmit(event)" class="p-5 space-y-4">

      <!-- Asset -->
      <div>
        <label class="block text-[11px] font-bold text-gray-600 mb-1.5">
          Asset Code <span class="text-red-500">*</span>
        </label>
        <div class="relative">
          <input
            type="text"
            id="reqAsset"
            placeholder="เช่น FA-CR001"
            list="req-asset-list"
            oninput="onAssetInput(this.value)"           
            class="w-full px-3 pr-12 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-blue-500">
          
          <datalist id="req-asset-list"></datalist>

          <button
            type="button"
            onclick="goToScannerAssetQR('reqAsset')"
            class="absolute right-2 top-1/2 -translate-y-1/2 w-9 h-9 flex items-center justify-center text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-lg">
            <i class="fas fa-qrcode text-lg"></i>
          </button>
        </div>
      </div>

      <!-- Component -->
      <div>
        <label class="block text-[11px] font-bold text-gray-600 mb-1.5">
          Component Code
        </label>
        <div class="relative">
          <input
            type="text"
            id="reqComp"
            placeholder="เช่น FA-CR001-MT01"
            list="req-component-list"
            class="w-full px-3 pr-12 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-blue-500">
          
          <datalist id="req-component-list"></datalist>

          <button
            type="button"
            onclick="goToScannerAssetQR('reqComp')"
            class="absolute right-2 top-1/2 -translate-y-1/2 w-9 h-9 flex items-center justify-center text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-lg">
            <i class="fas fa-qrcode text-lg"></i>
          </button>
        </div>
      </div>

      <!-- Type -->
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-2">
          ประเภท <span class="text-red-500">*</span>
        </label>
        <div class="grid grid-cols-2 gap-1 p-1 bg-gray-100/80 rounded-xl border border-gray-200/60">
          <label class="cursor-pointer">
            <input type="radio" name="reqType" id="reqTypeCM" value="CM" checked class="peer hidden">
            <div class="flex items-center justify-center gap-2 py-2 px-3 rounded-lg text-xs font-semibold text-gray-500 peer-checked:bg-white peer-checked:text-blue-600 peer-checked:shadow-sm">
              <i class="fa-solid fa-wrench text-xs"></i>
              แจ้งซ่อมทั่วไป
            </div>
          </label>

          <label class="cursor-pointer">
            <input type="radio" name="reqType" id="reqTypeBM" value="BM" class="peer hidden">
            <div class="flex items-center justify-center gap-2 py-2 px-3 rounded-lg text-xs font-semibold text-gray-500 peer-checked:bg-white peer-checked:text-red-600 peer-checked:shadow-sm">
              <i class="fa-solid fa-triangle-exclamation text-xs"></i>
              เครื่องจักรหยุดทำงาน
            </div>
          </label>
        </div>
      </div>

      <!-- Priority -->
      <select id="reqPriority" class="hidden">
        <option value="Normal">ปกติ</option>
        <option value="Medium">ปานกลาง</option>
        <option value="High">ด่วน</option>
        <option value="Critical">ด่วนที่สุด</option>
      </select>

      <!-- Description -->
      <div>
        <label class="block text-[11px] font-bold text-gray-600 mb-1.5">
          รายละเอียดปัญหา <span class="text-red-500">*</span>
        </label>
        <textarea
          id="reqDesc"
          rows="3"
          required
          placeholder="อธิบายอาการเสีย หรือปัญหาที่พบ..."
          class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm resize-none focus:outline-none focus:border-blue-500"></textarea>
      </div>

      <!-- Image -->
      <div>
        <label class="block text-[11px] font-bold text-gray-600 mb-1.5">
          รูปภาพ (ถ้ามี)
        </label>
        <input
          type="file"
          id="reqImageFile"
          accept="image/*"
          capture="environment"
          class="w-full text-[11px] text-gray-500 border border-gray-200 rounded-xl p-1.5 bg-gray-50/50">
      </div>

      <!-- Submit -->
      <button
        type="submit"
        id="submitBtn"
        class="w-full py-3 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white text-sm font-bold rounded-xl shadow-sm transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-paper-plane text-xs"></i>
        ส่งแจ้งซ่อม
      </button>

    </form>
  </div>

  <script>
    const LIFF_ID = "2011045112-nTERJAZu";
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbycxQiYGTTWx0vHp9KA2Z1aXKeGGnLqjES3HsHou43C/dev";

    let rawAssets = [];
    let rawComponents = [];
    let lineUserId = "";
    let lineDisplayName = "";
    let linePictureUrl = "";

    // 1. LIFF Initialization
    async function init() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          const profile = await liff.getProfile();
          lineUserId = profile.userId;
          lineDisplayName = profile.displayName;
          linePictureUrl = profile.pictureUrl;
        }
      } catch (err) {
        console.error("LIFF Init Error: ", err);
      }
      loadMachineData();
    }

    // 2. Fetch Machines & Components Data from GAS
    async function loadMachineData() {
      try {
        const res = await fetch(`${GAS_API_URL}?action=getMachines`);
        const json = await res.json();
        if (json.status === "success") {
          rawAssets = json.data.assets;
          rawComponents = json.data.components;
          renderAssetDatalist();
        }
      } catch (e) {
        console.error("Fetch Data Error:", e);
      }
    }

    // 3. Render Asset Datalist
    function renderAssetDatalist() {
      const assetList = document.getElementById("req-asset-list");
      assetList.innerHTML = "";
      rawAssets.forEach(item => {
        const opt = document.createElement("option");
        opt.value = item.assetCode;
        opt.label = item.machineName ? `${item.assetCode} - ${item.machineName}` : item.assetCode;
        assetList.appendChild(opt);
      });
    }

    // 4. Triggered when Asset Code Input Changes -> Filter Component List
    function onAssetInput(val) {
      const compList = document.getElementById("req-component-list");
      compList.innerHTML = "";
      
      const filtered = rawComponents.filter(c => c.assetCode === val || c.compCode.startsWith(val));
      filtered.forEach(item => {
        const opt = document.createElement("option");
        opt.value = item.compCode;
        opt.label = item.compName ? `${item.compCode} - ${item.compName}` : item.compCode;
        compList.appendChild(opt);
      });
    }

    // 5. QR Code Scanner Function for Input
    function goToScannerAssetQR(targetInputId) {
      if (liff.isInClient() && liff.scanCodeV2) {
        liff.scanCodeV2().then(result => {
          if (result.value) {
            const scannedValue = result.value.trim();
            document.getElementById(targetInputId).value = scannedValue;
            
            // ถ้าเป็นการสแกนช่อง Asset Code ให้ดึง Filter Component ต่อด้วย
            if (targetInputId === "reqAsset") {
              onAssetInput(scannedValue);
            }
          }
        }).catch(err => {
          console.error("QR Scan error: ", err);
        });
      } else {
        alert("การสแกน QR Code รองรับเฉพาะการใช้งานผ่านแอปพลิเคชัน LINE บนมือถือเท่านั้น");
      }
    }

    // Helper: Base64 Convert
    function getBase64(file) {
      return new Promise((resolve, reject) => {
        if (!file) resolve("");
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    // 6. Submit Handler
    async function handleRequestSubmit(e) {
      e.preventDefault();

      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-xs"></i> กำลังส่งข้อมูล...`;

      const file = document.getElementById("reqImageFile").files[0];
      const imageBase64 = file ? await getBase64(file) : "";
      
      const selectedType = document.querySelector('input[name="reqType"]:checked').value;

      const payload = {
        action: "createRepairRequest", // ระบุ Action ชัดเจน
        userId: lineUserId,
        displayName: lineDisplayName,
        pictureUrl:linePictureUrl,
        assetCode: document.getElementById("reqAsset").value,
        componentCode: document.getElementById("reqComp").value,
        reqType: selectedType,
        priority: document.getElementById("reqPriority").value,
        symptom: document.getElementById("reqDesc").value,
        image: imageBase64
      };

      try {
        await fetch(GAS_API_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        alert("ส่งข้อมูลการแจ้งซ่อมเรียบร้อยแล้ว!");
        if (liff.isInClient()) {
          liff.closeWindow();
        } else {
          location.reload();
        }
      } catch (err) {
        alert("เกิดข้อผิดพลาด: " + err.message);
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-paper-plane text-xs"></i> ส่งแจ้งซ่อม`;
      }
    }

    init();
  </script>
</body>
</html>
